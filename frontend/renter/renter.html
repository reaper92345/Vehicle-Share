<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renter Dashboard</title>
  <meta name="description" content="Renter dashboard showing users, equipment, earnings, rentals, deployments, due returns, and payment history." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="renter.css" />
</head>
<body>
  <header class="header">
    <h1>Renter Dashboard</h1>
  </header>

  <main class="container">
    <!-- Earnings Summary -->
    <section class="card summary-card">
      <h2>Total Earnings</h2>
      <p class="value">$<span id="total-earnings">0.00</span></p>
    </section>

    <!-- Users Table -->
    <section class="card">
      <h2>All Users</h2>
      <table class="data-table" id="users-table">
        <thead>
          <tr><th>Name</th><th>Email</th><th>Phone</th></tr>
        </thead>
        <tbody>
          <!-- Rows populated by renter.js -->
        </tbody>
      </table>
    </section>

    <!-- Equipment Table -->
    <section class="card">
      <h2>Listed Equipment</h2>
      <table class="data-table" id="equipment-table">
        <thead>
          <tr><th>Asset ID</th><th>Name</th><th>Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Rentals Overview -->
    <section class="card">
      <h2>Current Rentals</h2>
      <table class="data-table" id="rentals-table">
        <thead>
          <tr><th>Renter</th><th>Equipment</th><th>From</th><th>Deployed At</th><th>Due Return</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Payment History -->
    <section class="card">
      <h2>Payment History</h2>
      <table class="data-table" id="payments-table">
        <thead>
          <tr><th>Date</th><th>Amount</th><th>Reference</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="renter.js"></script>
</body>
</html>
